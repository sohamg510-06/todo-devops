global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: todo-app
    metrics_path: /metrics
    static_configs:
      - targets: ["todo-app:5000"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
