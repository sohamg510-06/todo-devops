groups:
  - name: todo-alerts
    rules:
      - alert: AppDown
        expr: up{job="todo-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "To-Do application is DOWN"

      - alert: HighCPUUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 80
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is above 80%"
